privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'KaufmannDigital.MCP:McpApi':
      matcher: 'method(KaufmannDigital\MCP\Controller\McpController->(.*)Action())'

