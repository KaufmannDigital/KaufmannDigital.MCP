KaufmannDigital:
  MCP:
    Token: null # TO BE SET in Configuration/Development/Settings.yaml

    # IP allowlist for incoming requests.
    # EMPTY LIST = BLOCK ALL (default). Must explicitly allow IPs or CIDRs.
    # Supports exact IPs and CIDR notation (IPv4 and IPv6).
    # Note: uses REMOTE_ADDR — behind a reverse proxy this may be the proxy IP.
    #
    # Common ranges to add in Development/Settings.yaml:
    #   '127.0.0.1'        — localhost IPv4
    #   '::1'              — localhost IPv6
    #   '172.16.0.0/12'    — Docker bridge networks (standard ddev, docker-compose)
    #   '192.168.0.0/16'   — typical local network
    #   '10.0.0.0/8'       — VPN / corporate network ranges
    allowedIps: []

    # Base directory for local file imports via upload_asset.
    # Relative paths are resolved from FLOW_PATH_ROOT (the project root).
    # Absolute paths are used as-is.
    localImportBasePath: 'Data/MCP-Import'

    # When a tool throws, return exception class, message, code, the affected node/property arguments and the
    # log reference to the client. Set to false to only return a generic message plus the log reference.
    # Token holders already have full CR access, so details are exposed by default.
    exposeErrorDetails: true

    # Request headers which are masked ('***') in Data/Logs/Exceptions dumps (case-insensitive).
    # The configured Token value is masked in the request information and backtraces as well.
    # Applies to all exceptions logged via Flow's throwable storage, not only /mcp requests.
    maskedRequestHeaders:
      - 'X-Api-Token'
      - 'Authorization'
      - 'Proxy-Authorization'
